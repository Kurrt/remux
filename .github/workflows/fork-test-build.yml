name: Fork test build

# Builds the server for linux/arm64 and the dashboard from this branch and
# publishes both as assets of a prerelease, so a test server can run them over
# the stock image. Lives only on this test branch; not part of any pull request.

on:
  push:
    branches: [test/trickplay-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-test-build
  cancel-in-progress: true

jobs:
  dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: dashboard
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 --no-confirm --force --locked
      - name: Build dashboard
        working-directory: crates/remux-dashboard
        run: ~/.cargo/bin/dx build --release
      - name: Pack dashboard
        run: tar -C target/dx/remux-dashboard/release/web/public -czf dashboard.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.tar.gz
          retention-days: 2

  server:
    name: Build server (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: server-arm64
      - name: Build remux-server
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --target aarch64-unknown-linux-gnu -p remux-server
      - name: Name the binary
        run: cp target/aarch64-unknown-linux-gnu/release/remux-server remux-server-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: remux-server-linux-arm64
          retention-days: 2

  publish:
    name: Publish test assets
    needs: [dashboard, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Replace the test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum remux-server-linux-arm64 dashboard.tar.gz > SHA256SUMS
          gh release delete trickplay-test --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create trickplay-test --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Trick play test build ${GITHUB_SHA::8}" \
            --notes "Test build of the trick play branch. Not a release." \
            remux-server-linux-arm64 dashboard.tar.gz SHA256SUMS
